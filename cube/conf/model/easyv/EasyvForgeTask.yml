# 由本体声明生成（CubeModelGenerator），请勿手工修改。
cubes:
  - name: "EasyvForgeTask"
    title: "应用生成任务"
    description: "Forge 生成任务（每次生成一条）"
    sql_table: "facts.easyv_forge_generation_task"
    meta:
      ontologyObject: "easyv-forge-task"
      productKey: "easyv-forge-task"
    joins:
      - name: "EasyvApplication"
        relationship: "many_to_one"
        sql: "{CUBE}.app_id = {EasyvApplication}.app_id"
    dimensions:
      - name: "productVersionId"
        sql: "{CUBE}.product_version_id"
        type: "string"
        public: false
      - name: "taskId"
        title: "生成任务 ID"
        sql: "{CUBE}.task_id"
        type: "string"
        primary_key: true
        public: true
      - name: "appId"
        title: "应用 ID"
        description: "任务所属应用"
        sql: "{CUBE}.app_id"
        type: "string"
      - name: "status"
        title: "任务状态"
        description: "completed / failed / cancelled / 进行中"
        sql: "{CUBE}.status"
        type: "string"
      - name: "failureReason"
        title: "失败原因"
        description: "归一化失败原因；无记录时为“（无失败原因记录）”"
        sql: "coalesce(nullif({CUBE}.failure_reason, ''), '（无失败原因记录）')"
        type: "string"
      - name: "createdAt"
        title: "任务创建时间"
        description: "任务创建时间（上海时区）"
        sql: "{CUBE}.created_at"
        type: "time"
      - name: "startedAt"
        title: "开始时间"
        description: "任务开始执行时间"
        sql: "{CUBE}.started_at"
        type: "time"
      - name: "finishedAt"
        title: "结束时间"
        description: "任务结束时间"
        sql: "{CUBE}.finished_at"
        type: "time"
    measures:
      - name: "count"
        title: "生成任务数"
        description: "去重生成任务数"
        sql: "{CUBE}.task_id"
        type: "count_distinct"
      - name: "failedCount"
        title: "失败任务数"
        description: "状态为 failed 的任务数"
        sql: "{CUBE}.task_id"
        type: "count_distinct"
        filters:
          - sql: "lower({CUBE}.status) = 'failed'"
      - name: "terminalCount"
        title: "终态任务数"
        description: "completed/failed/cancelled 任务数"
        sql: "{CUBE}.task_id"
        type: "count_distinct"
        filters:
          - sql: "lower({CUBE}.status) in ('completed','failed','cancelled')"
      - name: "timedTerminalCount"
        title: "可计时终态任务数"
        description: "有开始与结束时间的终态任务数"
        sql: "{CUBE}.task_id"
        type: "count_distinct"
        filters:
          - sql: "lower({CUBE}.status) in ('completed','failed','cancelled') and {CUBE}.started_at is not null and {CUBE}.finished_at is not null"
      - name: "durationP50Ms"
        title: "耗时 P50（毫秒）"
        description: "终态任务耗时中位数"
        sql: "ceil(percentile_cont(0.50) within group (order by extract(epoch from ({CUBE}.finished_at - {CUBE}.started_at)) * 1000) filter (where lower({CUBE}.status) in ('completed','failed','cancelled') and {CUBE}.started_at is not null and {CUBE}.finished_at is not null))"
        type: "number"
      - name: "durationP95Ms"
        title: "耗时 P95（毫秒）"
        description: "终态任务耗时 P95"
        sql: "ceil(percentile_cont(0.95) within group (order by extract(epoch from ({CUBE}.finished_at - {CUBE}.started_at)) * 1000) filter (where lower({CUBE}.status) in ('completed','failed','cancelled') and {CUBE}.started_at is not null and {CUBE}.finished_at is not null))"
        type: "number"
