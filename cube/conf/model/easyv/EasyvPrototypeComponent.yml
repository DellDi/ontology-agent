# 由本体声明生成（CubeModelGenerator），请勿手工修改。
cubes:
  - name: "EasyvPrototypeComponent"
    title: "原型图表组件"
    description: "原型区域内的图表组件实例（结构信息，不含标题与指标名称）"
    sql_table: "facts.easyv_prototype_component"
    meta:
      ontologyObject: "easyv-prototype-component"
      productKey: "easyv-prototype-component"
    joins:
      - name: "EasyvApplication"
        relationship: "many_to_one"
        sql: "{CUBE}.app_id = {EasyvApplication}.app_id"
    dimensions:
      - name: "productVersionId"
        sql: "{CUBE}.product_version_id"
        type: "string"
        public: false
      - name: "componentKey"
        title: "组件记录 ID"
        sql: "{CUBE}.source_id::text || ':' || {CUBE}.component_id"
        type: "string"
        primary_key: true
        public: true
      - name: "appId"
        title: "应用 ID"
        description: "组件所属应用"
        sql: "{CUBE}.app_id"
        type: "string"
      - name: "blockId"
        title: "区域 ID"
        description: "组件所在区域"
        sql: "{CUBE}.block_id"
        type: "string"
      - name: "chartFamily"
        title: "图表族"
        description: "line / donut / horizontal-bar / single-value-metric 等"
        sql: "{CUBE}.chart_family"
        type: "string"
      - name: "libraryComponentId"
        title: "组件库 ID"
        description: "EasyV 组件库中的组件标识"
        sql: "{CUBE}.library_component_id"
        type: "string"
      - name: "sceneType"
        title: "分析场景"
        description: "总览指标 / 趋势分析 / 对比排行 / 占比结构 等"
        sql: "{CUBE}.scene_type"
        type: "string"
      - name: "sourceType"
        title: "数据来源类型"
        description: "AI 生成 / CSV 文件"
        sql: "{CUBE}.source_type"
        type: "string"
      - name: "gridColSpan"
        title: "网格列跨度"
        description: "组件在区域网格中的列跨度"
        sql: "{CUBE}.grid_col_span"
        type: "number"
      - name: "gridRowSpan"
        title: "网格行跨度"
        description: "组件在区域网格中的行跨度"
        sql: "{CUBE}.grid_row_span"
        type: "number"
      - name: "createdAt"
        title: "原型创建时间"
        description: "所属原型创建时间"
        sql: "{CUBE}.created_at"
        type: "time"
    measures:
      - name: "count"
        title: "图表组件数"
        description: "图表组件实例数"
        type: "count"
      - name: "appCount"
        title: "涉及原型数"
        description: "含这些组件的去重原型数"
        sql: "{CUBE}.app_id"
        type: "count_distinct"
      - name: "blockCount"
        title: "涉及区域数"
        description: "含这些组件的去重区域数"
        sql: "{CUBE}.source_id::text || ':' || {CUBE}.block_id"
        type: "count_distinct"
      - name: "createdAtCoverageFrom"
        title: "原型创建时间（最早）"
        sql: "extract(epoch from min({CUBE}.created_at))"
        type: "number"
        meta:
          coverage: "true"
      - name: "createdAtCoverageTo"
        title: "原型创建时间（最晚）"
        sql: "extract(epoch from max({CUBE}.created_at))"
        type: "number"
        meta:
          coverage: "true"
