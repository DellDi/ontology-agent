# 由本体声明生成（CubeModelGenerator），请勿手工修改。
cubes:
  - name: "EasyvPipelineNode"
    title: "流水线节点"
    description: "原型流水线各阶段的节点执行记录"
    sql_table: "facts.easyv_pipeline_node"
    meta:
      ontologyObject: "easyv-pipeline-node"
      productKey: "easyv-pipeline-node"
    joins:
      - name: "EasyvApplication"
        relationship: "many_to_one"
        sql: "{CUBE}.task_id = {EasyvApplication}.generation_task_id"
    dimensions:
      - name: "productVersionId"
        sql: "{CUBE}.product_version_id"
        type: "string"
        public: false
      - name: "nodeId"
        title: "节点记录 ID"
        sql: "{CUBE}.source_id::text"
        type: "string"
        primary_key: true
        public: true
      - name: "taskId"
        title: "原型任务 ID"
        description: "节点所属原型流水线任务"
        sql: "{CUBE}.task_id"
        type: "string"
      - name: "stepName"
        title: "阶段"
        description: "流水线阶段名称"
        sql: "{CUBE}.step_name"
        type: "string"
      - name: "branch"
        title: "分支"
        description: "MAIN 为主链"
        sql: "upper({CUBE}.branch)"
        type: "string"
      - name: "status"
        title: "节点状态"
        description: "节点执行状态"
        sql: "upper({CUBE}.status)"
        type: "string"
      - name: "durationMs"
        title: "节点耗时（毫秒）"
        description: "节点执行耗时"
        sql: "{CUBE}.duration_ms"
        type: "number"
      - name: "createdAt"
        title: "节点时间"
        description: "节点记录时间"
        sql: "{CUBE}.created_at"
        type: "time"
    measures:
      - name: "count"
        title: "节点记录数"
        description: "节点记录数"
        type: "count"
      - name: "taskCount"
        title: "原型任务数"
        description: "有节点记录的去重原型任务数"
        sql: "{CUBE}.task_id"
        type: "count_distinct"
      - name: "mainTimedCount"
        title: "可计时主链节点数"
        description: "有耗时的 MAIN 主链节点数"
        type: "count"
        filters:
          - sql: "upper({CUBE}.branch) = 'MAIN' and {CUBE}.duration_ms is not null"
      - name: "durationP50Ms"
        title: "主链节点耗时 P50（毫秒）"
        description: "MAIN 主链节点耗时中位数"
        sql: "ceil(percentile_cont(0.50) within group (order by {CUBE}.duration_ms) filter (where upper({CUBE}.branch) = 'MAIN' and {CUBE}.duration_ms is not null))"
        type: "number"
      - name: "durationP95Ms"
        title: "主链节点耗时 P95（毫秒）"
        description: "MAIN 主链节点耗时 P95"
        sql: "ceil(percentile_cont(0.95) within group (order by {CUBE}.duration_ms) filter (where upper({CUBE}.branch) = 'MAIN' and {CUBE}.duration_ms is not null))"
        type: "number"
      - name: "createdAtCoverageFrom"
        title: "节点时间（最早）"
        sql: "extract(epoch from min({CUBE}.created_at))"
        type: "number"
        meta:
          coverage: "true"
      - name: "createdAtCoverageTo"
        title: "节点时间（最晚）"
        sql: "extract(epoch from max({CUBE}.created_at))"
        type: "number"
        meta:
          coverage: "true"
