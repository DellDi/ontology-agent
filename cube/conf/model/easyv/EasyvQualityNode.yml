# 由本体声明生成（CubeModelGenerator），请勿手工修改。
cubes:
  - name: "EasyvQualityNode"
    title: "需求与处理记录"
    description: "Step1 系统理解与 ChatExecution 记录；需关联真实操作记录。意图标签需原话抽样校准，节点数不等于轮次"
    sql: "select * from facts.easyv_pipeline_node where (branch = 'MAIN' and step_name = 'Step1') or (branch = 'CHAT' and step_name = 'ChatExecution')"
    meta:
      ontologyObject: "easyv-quality-node"
      productKey: "easyv-pipeline-node"
    joins:
      - name: "EasyvFeedback"
        relationship: "one_to_many"
        sql: "{CUBE}.task_id = {EasyvFeedback}.task_id"
      - name: "EasyvApplication"
        relationship: "many_to_one"
        sql: "{CUBE}.app_id = {EasyvApplication}.app_id"
      - name: "EasyvPrototypeLayout"
        relationship: "many_to_one"
        sql: "{CUBE}.app_id = {EasyvPrototypeLayout}.app_id"
    dimensions:
      - name: "productVersionId"
        sql: "{CUBE}.product_version_id"
        type: "string"
        public: false
      - name: "nodeId"
        title: "节点记录 ID"
        sql: "{CUBE}.source_id::text"
        type: "string"
        primary_key: true
        public: true
      - name: "taskId"
        title: "操作任务 ID"
        description: "关联操作记录的任务；可对应多个执行节点"
        sql: "{CUBE}.task_id"
        type: "string"
      - name: "appId"
        title: "应用 ID"
        description: "由同次采集的操作 task_id 精确关联"
        sql: "{CUBE}.app_id"
        type: "string"
      - name: "sessionId"
        title: "源端会话 ID"
        description: "源端会话关联，不是本平台分析会话"
        sql: "{CUBE}.session_id"
        type: "string"
      - name: "intent"
        title: "系统识别的诉求"
        description: "ACK/CLARIFY/OUT_OF_SCOPE 为非修改；其余标签也须原话抽样，不保证准确"
        sql: "{CUBE}.intent"
        type: "string"
      - name: "stepName"
        title: "处理环节"
        description: "Step1=生成理解；ChatExecution=修改执行"
        sql: "{CUBE}.step_name"
        type: "string"
      - name: "status"
        title: "处理状态"
        description: "源端 SUCCESS/FAILED/FALLBACK，不证明诉求满足或最终渲染质量"
        sql: "{CUBE}.status"
        type: "string"
      - name: "targetBlockId"
        title: "目标区域 ID"
        description: "仅部分意图记录；缺失不能推断为整屏操作"
        sql: "{CUBE}.target_block_id"
        type: "string"
      - name: "industryCategory"
        title: "系统理解的行业"
        description: "Step1 分类，非独立业务事实"
        sql: "{CUBE}.industry_category"
        type: "string"
      - name: "audienceType"
        title: "系统理解的受众"
        description: "Step1 分类，非独立业务事实"
        sql: "{CUBE}.audience_type"
        type: "string"
      - name: "evidenceStatus"
        title: "理解证据状态"
        description: "available/missing/invalid/not_applicable；旧冻结版本为空"
        sql: "{CUBE}.quality_evidence_status"
        type: "string"
      - name: "evidenceErrorCode"
        title: "理解证据错误码"
        description: "缺失或格式错误的可定位原因"
        sql: "{CUBE}.quality_evidence_error_code"
        type: "string"
      - name: "createdAt"
        title: "发生时间"
        description: "源端节点时间"
        sql: "{CUBE}.created_at"
        type: "time"
    measures:
      - name: "count"
        title: "处理记录数"
        description: "节点记录数，不等于修改轮次"
        type: "count"
      - name: "taskCount"
        title: "涉及请求数"
        description: "去重 task_id；按意图分组时一个多指令任务可出现在多组，不能相加为轮次总量"
        sql: "{CUBE}.task_id"
        type: "count_distinct"
      - name: "createdAtCoverageFrom"
        title: "发生时间（最早）"
        sql: "extract(epoch from min({CUBE}.created_at))"
        type: "number"
        meta:
          coverage: "true"
      - name: "createdAtCoverageTo"
        title: "发生时间（最晚）"
        sql: "extract(epoch from max({CUBE}.created_at))"
        type: "number"
        meta:
          coverage: "true"
