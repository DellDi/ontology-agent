# 由本体声明生成（CubeModelGenerator），请勿手工修改。
cubes:
  - name: "EasyvPipelineTask"
    title: "原型流水线任务"
    description: "按原型任务归并的流水线结果（由节点记录归并）"
    sql_table: "facts.easyv_pipeline_task"
    meta:
      ontologyObject: "easyv-pipeline-task"
      productKey: "easyv-pipeline-node"
    joins:
      - name: "EasyvApplication"
        relationship: "one_to_one"
        sql: "{CUBE}.task_id = {EasyvApplication}.generation_task_id"
    dimensions:
      - name: "productVersionId"
        sql: "{CUBE}.product_version_id"
        type: "string"
        public: false
      - name: "taskId"
        title: "原型任务 ID"
        sql: "{CUBE}.task_id"
        type: "string"
        primary_key: true
        public: true
      - name: "outcome"
        title: "流水线结果"
        description: "completed / failed / incomplete / conflict"
        sql: "{CUBE}.outcome"
        type: "string"
      - name: "nodeCount"
        title: "节点记录数"
        description: "任务的节点记录数"
        sql: "{CUBE}.node_count"
        type: "number"
      - name: "startedAt"
        title: "任务开始时间"
        description: "首个节点记录时间"
        sql: "{CUBE}.started_at"
        type: "time"
      - name: "lastNodeAt"
        title: "最近节点时间"
        description: "最后一个节点记录时间"
        sql: "{CUBE}.last_node_at"
        type: "time"
    measures:
      - name: "count"
        title: "原型任务数"
        description: "去重原型任务数"
        sql: "{CUBE}.task_id"
        type: "count_distinct"
      - name: "completedCount"
        title: "完成任务数"
        description: "主链完成且无失败的任务数"
        sql: "{CUBE}.task_id"
        type: "count_distinct"
        filters:
          - sql: "{CUBE}.outcome = 'completed'"
      - name: "failedCount"
        title: "失败任务数"
        description: "主链出现失败的任务数"
        sql: "{CUBE}.task_id"
        type: "count_distinct"
        filters:
          - sql: "{CUBE}.outcome = 'failed'"
      - name: "incompleteCount"
        title: "未完成任务数"
        description: "既未完成也未失败的任务数"
        sql: "{CUBE}.task_id"
        type: "count_distinct"
        filters:
          - sql: "{CUBE}.outcome = 'incomplete'"
      - name: "completionRate"
        title: "原型完成率（%）"
        description: "完成任务数 / 原型任务数"
        sql: "round(100.0 * {completedCount} / nullif({count}, 0), 2)"
        type: "number"
      - name: "startedAtCoverageFrom"
        title: "任务开始时间（最早）"
        sql: "extract(epoch from min({CUBE}.started_at))"
        type: "number"
        meta:
          coverage: "true"
      - name: "startedAtCoverageTo"
        title: "任务开始时间（最晚）"
        sql: "extract(epoch from max({CUBE}.started_at))"
        type: "number"
        meta:
          coverage: "true"
      - name: "lastNodeAtCoverageFrom"
        title: "最近节点时间（最早）"
        sql: "extract(epoch from min({CUBE}.last_node_at))"
        type: "number"
        meta:
          coverage: "true"
      - name: "lastNodeAtCoverageTo"
        title: "最近节点时间（最晚）"
        sql: "extract(epoch from max({CUBE}.last_node_at))"
        type: "number"
        meta:
          coverage: "true"
