# 由本体声明生成（CubeModelGenerator），请勿手工修改。
cubes:
  - name: "EasyvFeedback"
    title: "操作反馈"
    description: "生成需求、对话轮次、另存与评分的操作记录；一行是操作，不保证是有效修改"
    sql_table: "facts.easyv_generation_feedback"
    meta:
      ontologyObject: "easyv-generation-feedback"
      productKey: "easyv-generation-feedback"
    joins:
      - name: "EasyvApplication"
        relationship: "many_to_one"
        sql: "{CUBE}.app_id = {EasyvApplication}.app_id"
      - name: "EasyvPrototypeLayout"
        relationship: "many_to_one"
        sql: "{CUBE}.app_id = {EasyvPrototypeLayout}.app_id"
      - name: "EasyvQualityNode"
        relationship: "one_to_many"
        sql: "{CUBE}.task_id = {EasyvQualityNode}.task_id"
    dimensions:
      - name: "productVersionId"
        sql: "{CUBE}.product_version_id"
        type: "string"
        public: false
      - name: "operationId"
        title: "操作记录 ID"
        sql: "{CUBE}.source_id::text"
        type: "string"
        primary_key: true
        public: true
      - name: "userId"
        title: "操作用户 ID"
        description: "执行操作的 EasyV 用户"
        sql: "{CUBE}.user_id::text"
        type: "string"
      - name: "spaceId"
        title: "空间 ID"
        description: "操作所在空间"
        sql: "{CUBE}.space_id::text"
        type: "string"
      - name: "appId"
        title: "应用 ID"
        description: "操作关联的应用"
        sql: "{CUBE}.app_id"
        type: "string"
      - name: "actionType"
        title: "操作类型"
        description: "prototypeGeneration=生成或整屏重做；promptCompletion=需求润色；chatRefactor=对话轮次（含闲聊、澄清、不支持，非有效修改）；metricGeneration=指标池扩充；appGeneration=组合生成/另存反馈"
        sql: "{CUBE}.ai_action_type"
        type: "string"
      - name: "taskId"
        title: "操作任务 ID"
        description: "关联节点的任务；一个任务可有多个执行节点，不把节点数当轮次"
        sql: "{CUBE}.task_id"
        type: "string"
      - name: "executeResult"
        title: "执行结果"
        description: "源端操作结果，混合业务执行与积分结算；成功不证明诉求满足"
        sql: "case {CUBE}.execute_result when 1 then '记录成功' when 0 then '记录失败' end"
        type: "string"
      - name: "rating"
        title: "评分"
        description: "整屏评分 1-5；单轮赞/踩为 4/2，两类不可混作满意度，未评分为空"
        sql: "{CUBE}.rating"
        type: "number"
      - name: "saveAsEdit"
        title: "是否另存编辑"
        description: "该条生成反馈的另存标记；只更新当时最近 appGeneration 行。有过另存不代表最终版本已另存，也不等于满意"
        sql: "{CUBE}.is_save_as_edit"
        type: "boolean"
      - name: "userInputTruncated"
        title: "用户原话已截断"
        description: "null 为旧冻结版本未采；true 表示只保留前 4000 字符"
        sql: "{CUBE}.user_input_truncated"
        type: "boolean"
      - name: "failureReasonTruncated"
        title: "失败原因已截断"
        description: "null 为旧冻结版本未采"
        sql: "{CUBE}.failure_reason_truncated"
        type: "boolean"
      - name: "userInputHash"
        title: "原话分组键"
        description: "完整原话的 SHA-256；不能据此判断诉求相似"
        sql: "{CUBE}.user_input_hash"
        type: "string"
      - name: "failureReasonHash"
        title: "失败原因分组键"
        description: "完整失败原因的 SHA-256，不证明根因相同"
        sql: "{CUBE}.failure_reason_hash"
        type: "string"
      - name: "operatedAt"
        title: "操作时间"
        description: "用户操作时间"
        sql: "{CUBE}.operated_at"
        type: "time"
    measures:
      - name: "count"
        title: "操作记录数"
        description: "操作记录数"
        type: "count"
      - name: "appCount"
        title: "涉及应用数"
        description: "有操作反馈的去重应用数"
        sql: "{CUBE}.app_id"
        type: "count_distinct"
      - name: "chatRoundCount"
        title: "对话轮次数"
        description: "chatRefactor 操作数，包含非修改对话"
        type: "count"
        filters:
          - sql: "{CUBE}.ai_action_type = 'chatRefactor'"
      - name: "adoptedAppCount"
        title: "另存采纳应用数"
        description: "至少另存一次的去重应用数，不等于满意"
        sql: "{CUBE}.app_id"
        type: "count_distinct"
        filters:
          - sql: "{CUBE}.is_save_as_edit is true"
      - name: "userCount"
        title: "操作用户数"
        description: "去重操作用户数"
        sql: "{CUBE}.user_id"
        type: "count_distinct"
      - name: "ratedCount"
        title: "有效评分数"
        description: "1-5 分的评分记录数"
        type: "count"
        filters:
          - sql: "{CUBE}.rating between 1 and 5"
      - name: "averageRating"
        title: "平均评分"
        description: "有效评分的平均值"
        sql: "{CUBE}.rating"
        type: "avg"
        filters:
          - sql: "{CUBE}.rating between 1 and 5"
      - name: "saveAsEditCount"
        title: "另存编辑数"
        description: "另存为编辑的记录数"
        type: "count"
        filters:
          - sql: "{CUBE}.is_save_as_edit is true"
      - name: "successCount"
        title: "记录成功数"
        description: "execute_result=1 的记录数"
        type: "count"
        filters:
          - sql: "{CUBE}.execute_result = 1"
      - name: "failureCount"
        title: "记录失败数"
        description: "execute_result=0 的记录数"
        type: "count"
        filters:
          - sql: "{CUBE}.execute_result = 0"
      - name: "successRate"
        title: "记录成功率（%）"
        description: "execute_result=1 / 操作记录数，不代表需求满足率"
        sql: "round(100.0 * {successCount} / nullif({count}, 0), 2)"
        type: "number"
      - name: "operatedAtCoverageFrom"
        title: "操作时间（最早）"
        sql: "extract(epoch from min({CUBE}.operated_at))"
        type: "number"
        meta:
          coverage: "true"
      - name: "operatedAtCoverageTo"
        title: "操作时间（最晚）"
        sql: "extract(epoch from max({CUBE}.operated_at))"
        type: "number"
        meta:
          coverage: "true"
