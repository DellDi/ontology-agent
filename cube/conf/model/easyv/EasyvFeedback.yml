# 由本体声明生成（CubeModelGenerator），请勿手工修改。
cubes:
  - name: "EasyvFeedback"
    title: "操作反馈"
    description: "用户对 AI 生成结果的操作记录（评分、另存、组合执行）"
    sql_table: "facts.easyv_generation_feedback"
    meta:
      ontologyObject: "easyv-generation-feedback"
      productKey: "easyv-generation-feedback"
    joins:
      - name: "EasyvApplication"
        relationship: "many_to_one"
        sql: "{CUBE}.app_id = {EasyvApplication}.app_id"
    dimensions:
      - name: "productVersionId"
        sql: "{CUBE}.product_version_id"
        type: "string"
        public: false
      - name: "operationId"
        title: "操作记录 ID"
        sql: "{CUBE}.source_id::text"
        type: "string"
        primary_key: true
        public: true
      - name: "userId"
        title: "操作用户 ID"
        description: "执行操作的 EasyV 用户"
        sql: "{CUBE}.user_id::text"
        type: "string"
      - name: "spaceId"
        title: "空间 ID"
        description: "操作所在空间"
        sql: "{CUBE}.space_id::text"
        type: "string"
      - name: "appId"
        title: "应用 ID"
        description: "操作关联的应用"
        sql: "{CUBE}.app_id"
        type: "string"
      - name: "actionType"
        title: "操作类型"
        description: "AI 操作类型"
        sql: "{CUBE}.ai_action_type"
        type: "string"
      - name: "executeResult"
        title: "执行结果"
        description: "组合成功 / 组合失败"
        sql: "case {CUBE}.execute_result when 1 then '组合成功' when 0 then '组合失败' end"
        type: "string"
      - name: "rating"
        title: "评分"
        description: "1-5 分，未评分为空"
        sql: "{CUBE}.rating"
        type: "number"
      - name: "saveAsEdit"
        title: "是否另存编辑"
        description: "是否另存为编辑"
        sql: "{CUBE}.is_save_as_edit"
        type: "boolean"
      - name: "operatedAt"
        title: "操作时间"
        description: "用户操作时间"
        sql: "{CUBE}.operated_at"
        type: "time"
    measures:
      - name: "count"
        title: "操作记录数"
        description: "操作记录数"
        type: "count"
      - name: "userCount"
        title: "操作用户数"
        description: "去重操作用户数"
        sql: "{CUBE}.user_id"
        type: "count_distinct"
      - name: "ratedCount"
        title: "有效评分数"
        description: "1-5 分的评分记录数"
        type: "count"
        filters:
          - sql: "{CUBE}.rating between 1 and 5"
      - name: "averageRating"
        title: "平均评分"
        description: "有效评分的平均值"
        sql: "{CUBE}.rating"
        type: "avg"
        filters:
          - sql: "{CUBE}.rating between 1 and 5"
      - name: "saveAsEditCount"
        title: "另存编辑数"
        description: "另存为编辑的记录数"
        type: "count"
        filters:
          - sql: "{CUBE}.is_save_as_edit is true"
      - name: "successCount"
        title: "组合成功数"
        description: "execute_result=1 的记录数"
        type: "count"
        filters:
          - sql: "{CUBE}.execute_result = 1"
      - name: "failureCount"
        title: "组合失败数"
        description: "execute_result=0 的记录数"
        type: "count"
        filters:
          - sql: "{CUBE}.execute_result = 0"
      - name: "successRate"
        title: "组合成功率（%）"
        description: "组合成功数 / 操作记录数"
        sql: "round(100.0 * {successCount} / nullif({count}, 0), 2)"
        type: "number"
      - name: "operatedAtCoverageFrom"
        title: "操作时间（最早）"
        sql: "extract(epoch from min({CUBE}.operated_at))"
        type: "number"
        meta:
          coverage: "true"
      - name: "operatedAtCoverageTo"
        title: "操作时间（最晚）"
        sql: "extract(epoch from max({CUBE}.operated_at))"
        type: "number"
        meta:
          coverage: "true"
