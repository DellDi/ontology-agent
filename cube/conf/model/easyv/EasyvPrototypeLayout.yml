# 由本体声明生成（CubeModelGenerator），请勿手工修改。
cubes:
  - name: "EasyvPrototypeLayout"
    title: "原型版式"
    description: "原型的版式与结构签名（每个原型一条；无法解析的原型保留并标注原因）"
    sql_table: "facts.easyv_prototype_layout"
    meta:
      ontologyObject: "easyv-prototype-layout"
      productKey: "easyv-prototype-layout"
    joins:
      - name: "EasyvApplication"
        relationship: "one_to_one"
        sql: "{CUBE}.app_id = {EasyvApplication}.app_id"
      - name: "EasyvPrototypeBlock"
        relationship: "one_to_many"
        sql: "{CUBE}.app_id = {EasyvPrototypeBlock}.app_id"
      - name: "EasyvPrototypeComponent"
        relationship: "one_to_many"
        sql: "{CUBE}.app_id = {EasyvPrototypeComponent}.app_id"
    dimensions:
      - name: "productVersionId"
        sql: "{CUBE}.product_version_id"
        type: "string"
        public: false
      - name: "appId"
        title: "应用 ID"
        sql: "{CUBE}.app_id"
        type: "string"
        primary_key: true
        public: true
      - name: "parseStatus"
        title: "解析状态"
        description: "ok / invalid_xml / invalid_json / inconsistent；非 ok 的原型没有区域、组件与签名"
        sql: "{CUBE}.parse_status"
        type: "string"
      - name: "parseErrorCode"
        title: "解析错误码"
        description: "解析失败时的可定位错误码"
        sql: "{CUBE}.parse_error_code"
        type: "string"
      - name: "layoutType"
        title: "布局类型"
        description: "凹形 / 左中右 / dashboard_02 等模板版式"
        sql: "{CUBE}.layout_type"
        type: "string"
      - name: "blockCount"
        title: "区域数"
        description: "原型包含的区域（Block）数量"
        sql: "{CUBE}.block_count"
        type: "number"
      - name: "componentCount"
        title: "图表组件数"
        description: "原型包含的图表组件数量"
        sql: "{CUBE}.component_count"
        type: "number"
      - name: "layoutSignature"
        title: "版式签名（L1）"
        description: "布局类型 + 各区域位置/区域类型/尺寸/跨度相同则签名相同"
        sql: "{CUBE}.layout_signature"
        type: "string"
      - name: "schemeSignature"
        title: "方案签名（L2）"
        description: "在版式签名基础上加上各区域所用图表方案"
        sql: "{CUBE}.scheme_signature"
        type: "string"
      - name: "countSignature"
        title: "图表数签名（L3）"
        description: "在方案签名基础上加上各区域图表数量"
        sql: "{CUBE}.count_signature"
        type: "string"
      - name: "chartSignature"
        title: "图表族签名（L4）"
        description: "在图表数签名基础上加上各区域图表族组合，最严格"
        sql: "{CUBE}.chart_signature"
        type: "string"
      - name: "createdAt"
        title: "原型创建时间"
        description: "原型创建时间"
        sql: "{CUBE}.created_at"
        type: "time"
      - name: "updatedAt"
        title: "原型更新时间"
        description: "原型最近更新时间"
        sql: "{CUBE}.updated_at"
        type: "time"
    measures:
      - name: "count"
        title: "原型数"
        description: "含无法解析在内的去重原型数"
        sql: "{CUBE}.app_id"
        type: "count_distinct"
      - name: "parsedCount"
        title: "已解析原型数"
        description: "结构可解析的去重原型数（重复分析的分母）"
        sql: "{CUBE}.app_id"
        type: "count_distinct"
        filters:
          - sql: "{CUBE}.parse_status = 'ok'"
      - name: "unparsedCount"
        title: "无法解析原型数"
        description: "结构无法解析的去重原型数"
        sql: "{CUBE}.app_id"
        type: "count_distinct"
        filters:
          - sql: "{CUBE}.parse_status <> 'ok'"
      - name: "blockTotal"
        title: "区域总数"
        description: "已解析原型的区域实例总数"
        sql: "{CUBE}.block_count"
        type: "sum"
        filters:
          - sql: "{CUBE}.parse_status = 'ok'"
      - name: "componentTotal"
        title: "图表组件总数"
        description: "已解析原型的图表组件实例总数"
        sql: "{CUBE}.component_count"
        type: "sum"
        filters:
          - sql: "{CUBE}.parse_status = 'ok'"
      - name: "layoutSignatureCount"
        title: "不同版式数（L1）"
        description: "去重版式签名数；已解析原型数减去它为每组保留一个后的额外原型数，不等于参与重复组的原型数"
        sql: "{CUBE}.layout_signature"
        type: "count_distinct"
        filters:
          - sql: "{CUBE}.parse_status = 'ok'"
      - name: "schemeSignatureCount"
        title: "不同方案组合数（L2）"
        description: "去重方案签名数"
        sql: "{CUBE}.scheme_signature"
        type: "count_distinct"
        filters:
          - sql: "{CUBE}.parse_status = 'ok'"
      - name: "countSignatureCount"
        title: "不同图表数组合数（L3）"
        description: "去重图表数签名数"
        sql: "{CUBE}.count_signature"
        type: "count_distinct"
        filters:
          - sql: "{CUBE}.parse_status = 'ok'"
      - name: "chartSignatureCount"
        title: "不同图表族组合数（L4）"
        description: "去重图表族签名数"
        sql: "{CUBE}.chart_signature"
        type: "count_distinct"
        filters:
          - sql: "{CUBE}.parse_status = 'ok'"
      - name: "createdAtCoverageFrom"
        title: "原型创建时间（最早）"
        sql: "extract(epoch from min({CUBE}.created_at))"
        type: "number"
        meta:
          coverage: "true"
      - name: "createdAtCoverageTo"
        title: "原型创建时间（最晚）"
        sql: "extract(epoch from max({CUBE}.created_at))"
        type: "number"
        meta:
          coverage: "true"
      - name: "updatedAtCoverageFrom"
        title: "原型更新时间（最早）"
        sql: "extract(epoch from min({CUBE}.updated_at))"
        type: "number"
        meta:
          coverage: "true"
      - name: "updatedAtCoverageTo"
        title: "原型更新时间（最晚）"
        sql: "extract(epoch from max({CUBE}.updated_at))"
        type: "number"
        meta:
          coverage: "true"
