# 由本体声明生成（CubeModelGenerator），请勿手工修改。
cubes:
  - name: "EasyvPrototypeBlock"
    title: "原型区域"
    description: "原型版式中的区域（Block），含所用图表方案与尺寸类别"
    sql_table: "facts.easyv_prototype_block"
    meta:
      ontologyObject: "easyv-prototype-block"
      productKey: "easyv-prototype-block"
    joins:
      - name: "EasyvApplication"
        relationship: "many_to_one"
        sql: "{CUBE}.app_id = {EasyvApplication}.app_id"
    dimensions:
      - name: "productVersionId"
        sql: "{CUBE}.product_version_id"
        type: "string"
        public: false
      - name: "blockKey"
        title: "区域记录 ID"
        sql: "{CUBE}.source_id::text || ':' || {CUBE}.block_id"
        type: "string"
        primary_key: true
        public: true
      - name: "appId"
        title: "应用 ID"
        description: "区域所属应用"
        sql: "{CUBE}.app_id"
        type: "string"
      - name: "position"
        title: "区域位置"
        description: "区域在版式中的位置标识（如 left_1）"
        sql: "regexp_replace({CUBE}.block_id, '^.*?__', '')"
        type: "string"
      - name: "containerTag"
        title: "所在容器"
        description: "Sider / Header / Footer 等容器类型"
        sql: "{CUBE}.container_tag"
        type: "string"
      - name: "gridDirection"
        title: "容器排布方向"
        description: "horizontal / vertical"
        sql: "{CUBE}.grid_direction"
        type: "string"
      - name: "blockTypeId"
        title: "区域类型"
        description: "区域规格类型（决定可用图表方案集合）"
        sql: "{CUBE}.block_type_id"
        type: "string"
      - name: "blockSize"
        title: "区域尺寸"
        description: "small / medium / large；页眉页脚等区域源端未标注时为“未标注”"
        sql: "coalesce({CUBE}.block_size, '未标注')"
        type: "string"
      - name: "span"
        title: "跨度"
        description: "区域在父容器排布方向上的占比"
        sql: "{CUBE}.span"
        type: "string"
      - name: "schemeId"
        title: "图表方案"
        description: "区域采用的图表方案 ID"
        sql: "{CUBE}.scheme_id"
        type: "string"
      - name: "componentCount"
        title: "图表数"
        description: "区域内的图表组件数量"
        sql: "{CUBE}.component_count"
        type: "number"
      - name: "createdAt"
        title: "原型创建时间"
        description: "所属原型创建时间"
        sql: "{CUBE}.created_at"
        type: "time"
    measures:
      - name: "count"
        title: "区域数"
        description: "区域实例数"
        type: "count"
      - name: "appCount"
        title: "涉及原型数"
        description: "含这些区域的去重原型数"
        sql: "{CUBE}.app_id"
        type: "count_distinct"
      - name: "componentTotal"
        title: "图表组件总数"
        description: "这些区域内的图表组件实例总数"
        sql: "{CUBE}.component_count"
        type: "sum"
      - name: "createdAtCoverageFrom"
        title: "原型创建时间（最早）"
        sql: "extract(epoch from min({CUBE}.created_at))"
        type: "number"
        meta:
          coverage: "true"
      - name: "createdAtCoverageTo"
        title: "原型创建时间（最晚）"
        sql: "extract(epoch from max({CUBE}.created_at))"
        type: "number"
        meta:
          coverage: "true"
