name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.7.0"
  JAVA_VERSION: "21"

jobs:
  # ── 静态检查（不需要数据库） ──────────────────────────
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm exec tsc --noEmit

  # ── Java 后端全量测试（Testcontainers: PostgreSQL/Neo4j） ──
  java-test:
    name: Java Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Maven tests
        run: mvn -B -ntp -f backend-java/pom.xml test

  # ── Web 契约测试（纯静态，不依赖外部服务） ─────────────
  web-test:
    name: Web Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Web contract tests
        run: pnpm test:web

      - name: Compose config validation
        run: |
          docker compose -f compose.yaml --env-file .env.example config --quiet
          docker compose -f compose.prod.yaml --env-file .env.prod.example config --quiet
