spring:
  application:
    name: ontology-agent-backend
  # 数据库迁移由独立 migrate 入口执行（--spring.profiles.active=migrate），
  # 应用常规启动不做自动迁移，避免对未 baseline 的老库直接重跑 V1~V6。
  flyway:
    enabled: false
  datasource:
    url: ${JAVA_DATABASE_URL:jdbc:postgresql://127.0.0.1:${POSTGRES_PORT}/${POSTGRES_DB}}
    username: ${JAVA_DATABASE_USERNAME:${POSTGRES_USER}}
    password: ${JAVA_DATABASE_PASSWORD:${POSTGRES_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Taipei'
  data:
    redis:
      url: ${REDIS_URL}
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never
    tools:
      throw-exception-on-error: true
    openai:
      base-url: ${LLM_PROVIDER_BASE_URL}
      api-key: ${LLM_PROVIDER_API_KEY}
      chat:
        model: ${LLM_PROVIDER_MODEL}
        max-retries: 0
        parallel-tool-calls: false
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
dip3:
  easyv:
    # 默认不连接业务源库；启用前必须使用专用只读角色。
    enabled: ${EASYV_POSTGRES_ENABLED:false}
    jdbc-url: ${EASYV_POSTGRES_JDBC_URL:}
    username: ${EASYV_POSTGRES_USERNAME:}
    password: ${EASYV_POSTGRES_PASSWORD:}
    schema: ${EASYV_POSTGRES_SCHEMA:easyv_saas}
    maximum-pool-size: ${EASYV_POSTGRES_MAX_POOL_SIZE:2}
    connection-timeout: ${EASYV_POSTGRES_CONNECTION_TIMEOUT_MS:2000}ms
    validation-timeout: ${EASYV_POSTGRES_VALIDATION_TIMEOUT_MS:1000}ms
    statement-timeout: ${EASYV_POSTGRES_STATEMENT_TIMEOUT_MS:3000}ms
    lock-timeout: ${EASYV_POSTGRES_LOCK_TIMEOUT_MS:1000}ms
    idle-in-transaction-session-timeout: ${EASYV_POSTGRES_IDLE_IN_TRANSACTION_TIMEOUT_MS:5000}ms
    require-read-only-role: ${EASYV_POSTGRES_REQUIRE_READ_ONLY_ROLE:true}
  ai:
    provider:
      mode: ${LLM_PROVIDER_MODE}
      tool-calling: ${LLM_PROVIDER_TOOL_CALLING}
      structured-output: ${LLM_PROVIDER_STRUCTURED_OUTPUT}
  session-secret: ${SESSION_SECRET}
  redis-key-prefix: ${REDIS_KEY_PREFIX:dip3}
  # ERP 目录认证（账号密码登录）；为空表示目录登录不可用
  erp-api-base-url: ${ERP_API_BASE_URL:}
  erp-api-origin: ${ERP_API_ORIGIN:}
  # 开发联调登录入口（手填 scope / ticket 回调）
  dev-auth-enabled: ${ENABLE_DEV_ERP_AUTH:false}
  # URL 桥接登录
  url-bridge-enabled: ${ENABLE_URL_BRIDGE:false}
  # 会话 Cookie 是否带 Secure（生产容器显式置 true）
  cookie-secure: ${COOKIE_SECURE:false}
  cube:
    api-url: ${CUBE_API_URL}
    api-secret: ${CUBE_API_SECRET}
    timeout: ${CUBE_QUERY_TIMEOUT_MS:15000}ms
  neo4j:
    uri: ${NEO4J_URI}
    username: ${NEO4J_USERNAME}
    password: ${NEO4J_PASSWORD}
    database: ${NEO4J_DATABASE:neo4j}
  worker:
    enabled: ${JAVA_WORKER_ENABLED:true}
    poll-delay: ${JAVA_WORKER_POLL_DELAY:250ms}
  graph-sync:
    enabled: ${JAVA_GRAPH_SYNC_ENABLED:false}
    poll-delay: ${JAVA_GRAPH_SYNC_POLL_DELAY:5m}
    sources: ${JAVA_GRAPH_SYNC_SOURCES:erp.organizations,erp.projects,erp.owners,erp.charge_items,erp.receivables,erp.payments,erp.service_orders}
  stream:
    poll-delay: ${JAVA_STREAM_POLL_DELAY:300ms}
    timeout: ${JAVA_STREAM_TIMEOUT:5m}
