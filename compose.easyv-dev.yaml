name: ontology-agent-easyv-dev

x-java-image: &java-image
  image: ${ONTOLOGY_JAVA_IMAGE:-ontology-agent-java:easyv-dev}

x-platform-database: &platform-database
  JAVA_DATABASE_URL: ${JAVA_DATABASE_URL:?JAVA_DATABASE_URL is required}
  JAVA_DATABASE_USERNAME: ${JAVA_DATABASE_USERNAME:?JAVA_DATABASE_USERNAME is required}
  JAVA_DATABASE_PASSWORD: ${JAVA_DATABASE_PASSWORD:?JAVA_DATABASE_PASSWORD is required}

x-cube-platform-database: &cube-platform-database
  CUBEJS_DB_TYPE: postgres
  CUBEJS_DB_HOST: ${PLATFORM_POSTGRES_HOST:?PLATFORM_POSTGRES_HOST is required}
  CUBEJS_DB_PORT: ${PLATFORM_POSTGRES_PORT:?PLATFORM_POSTGRES_PORT is required}
  CUBEJS_DB_NAME: ${PLATFORM_POSTGRES_DB:?PLATFORM_POSTGRES_DB is required}
  CUBEJS_DB_USER: ${JAVA_DATABASE_USERNAME:?JAVA_DATABASE_USERNAME is required}
  CUBEJS_DB_PASS: ${JAVA_DATABASE_PASSWORD:?JAVA_DATABASE_PASSWORD is required}

services:
  valkey:
    image: ${VALKEY_IMAGE:-ghcr.io/valkey-io/valkey:8.1-alpine}
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - valkey-data:/data
    restart: unless-stopped

  migrate:
    <<: *java-image
    environment:
      <<: *platform-database
    command: ["--spring.profiles.active=migrate"]
    restart: "no"

  backend:
    <<: *java-image
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      cube:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      <<: *platform-database
      REDIS_URL: redis://valkey:6379
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-easyv-dev}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      ERP_API_BASE_URL: ${ERP_API_BASE_URL:-}
      ENABLE_DEV_ERP_AUTH: ${ENABLE_DEV_ERP_AUTH:-true}
      ENABLE_URL_BRIDGE: ${ENABLE_URL_BRIDGE:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CUBE_API_URL: http://cube:4000/cubejs-api/v1
      CUBE_API_SECRET: ${CUBE_API_SECRET:?CUBE_API_SECRET is required}
      CUBE_QUERY_TIMEOUT_MS: ${CUBE_QUERY_TIMEOUT_MS:-15000}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:?NEO4J_USERNAME is required}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_DATABASE: ${NEO4J_DATABASE:?NEO4J_DATABASE is required}
      LLM_PROVIDER_BASE_URL: ${LLM_PROVIDER_BASE_URL:?LLM_PROVIDER_BASE_URL is required}
      LLM_PROVIDER_API_KEY: ${LLM_PROVIDER_API_KEY:?LLM_PROVIDER_API_KEY is required}
      LLM_PROVIDER_MODEL: ${LLM_PROVIDER_MODEL:?LLM_PROVIDER_MODEL is required}
      LLM_PROVIDER_MODE: ${LLM_PROVIDER_MODE:-openai-compatible}
      LLM_PROVIDER_TOOL_CALLING: ${LLM_PROVIDER_TOOL_CALLING:-true}
      LLM_PROVIDER_STRUCTURED_OUTPUT: ${LLM_PROVIDER_STRUCTURED_OUTPUT:-native-json-schema}
      EASYV_DOMAIN_ENABLED: "true"
      EASYV_POSTGRES_ENABLED: "false"
      JAVA_WORKER_ENABLED: "true"
      JAVA_GRAPH_SYNC_ENABLED: ${JAVA_GRAPH_SYNC_ENABLED:-true}
      JAVA_GRAPH_SYNC_POLL_DELAY: ${JAVA_GRAPH_SYNC_POLL_DELAY:-5m}
      GRAPH_SYNC_OPS_SECRET: ${GRAPH_SYNC_OPS_SECRET:?GRAPH_SYNC_OPS_SECRET is required}
      MANAGEMENT_ENDPOINT_HEALTH_GROUP_EASYV_INCLUDE: readinessState,db,redis,cube,neo4j,llmProvider
    ports:
      - "127.0.0.1:${JAVA_BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health/easyv >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  web:
    image: ${ONTOLOGY_WEB_IMAGE:-ontology-agent-web:easyv-dev}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      APP_PORT: 3000
      HOSTNAME: 0.0.0.0
      JAVA_BACKEND_URL: http://backend:8080
    ports:
      - "${EASYV_DEMO_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('node:net').connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  cube:
    image: ${CUBE_IMAGE:-cubejs/cube:v1.6.31}
    depends_on:
      cubestore-router:
        condition: service_healthy
      cubestore-worker:
        condition: service_healthy
    environment:
      <<: *cube-platform-database
      CUBEJS_API_SECRET: ${CUBE_API_SECRET:?CUBE_API_SECRET is required}
      CUBEJS_DEV_MODE: "false"
      CUBEJS_TELEMETRY: "false"
      CUBEJS_DEFAULT_TIMEZONE: Asia/Taipei
      CUBEJS_CUBESTORE_HOST: cubestore-router
      CUBEJS_CUBESTORE_PORT: "3030"
    volumes:
      - ./cube/conf:/cube/conf
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  cubestore-router:
    image: ${CUBESTORE_IMAGE:-cubejs/cubestore:v1.6.31}
    environment:
      CUBESTORE_SERVER_NAME: cubestore-router:9999
      CUBESTORE_META_PORT: "9999"
      CUBESTORE_WORKERS: cubestore-worker:9001
      CUBESTORE_REMOTE_DIR: /cube/data
      CUBESTORE_DATA_DIR: /cube/data/scratch/router
    volumes:
      - cube-store:/cube/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3030'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  cubestore-worker:
    image: ${CUBESTORE_IMAGE:-cubejs/cubestore:v1.6.31}
    depends_on:
      cubestore-router:
        condition: service_healthy
    environment:
      CUBESTORE_SERVER_NAME: cubestore-worker:9001
      CUBESTORE_WORKER_PORT: "9001"
      CUBESTORE_META_ADDR: cubestore-router:9999
      CUBESTORE_WORKERS: cubestore-worker:9001
      CUBESTORE_REMOTE_DIR: /cube/data
      CUBESTORE_DATA_DIR: /cube/data/scratch/worker
    volumes:
      - cube-store:/cube/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9001'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.26.24-community-ubi10}
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:?NEO4J_USERNAME is required}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_dbms_default__database: ${NEO4J_DATABASE:?NEO4J_DATABASE is required}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://127.0.0.1:7687 -u ${NEO4J_USERNAME:?NEO4J_USERNAME is required} -p ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required} 'RETURN 1;' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  ingest:
    <<: *java-image
    profiles: ["ops"]
    environment:
      <<: *platform-database
      EASYV_DOMAIN_ENABLED: "true"
      EASYV_POSTGRES_ENABLED: "true"
      EASYV_POSTGRES_JDBC_URL:
      EASYV_POSTGRES_USERNAME:
      EASYV_POSTGRES_PASSWORD:
      EASYV_POSTGRES_SCHEMA:
      EASYV_POSTGRES_REQUIRE_READ_ONLY_ROLE:
    command:
      - --spring.profiles.active=ingest
      - --dip3.ingestion.source-key=easyv
      - --dip3.ingestion.product-keys=easyv-ai-application,easyv-prototype-task,easyv-pipeline-node,easyv-forge-task,easyv-generation-feedback
      - --dip3.ingestion.mode=${INGEST_MODE:-INCREMENTAL}
      - --dip3.ingestion.trigger=${INGEST_TRIGGER:-MANUAL}
      - --dip3.ingestion.requested-by=${INGEST_REQUESTED_BY:-easyv-dev}
      - --dip3.ingestion.page-size=${INGEST_PAGE_SIZE:-2000}
    restart: "no"

  property-ingest:
    <<: *java-image
    profiles: ["ops"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *platform-database
      EASYV_DOMAIN_ENABLED: "false"
      EASYV_POSTGRES_ENABLED: "false"
      JAVA_GRAPH_SYNC_ENABLED: "false"
    command:
      - --spring.profiles.active=ingest
      - --dip3.ingestion.source-key=property
      - --dip3.ingestion.product-keys=property-organization,property-project,property-charge-item,property-receivable,property-payment,property-service-order
      - --dip3.ingestion.mode=${PROPERTY_INGEST_MODE:-INCREMENTAL}
      - --dip3.ingestion.trigger=${INGEST_TRIGGER:-MANUAL}
      - --dip3.ingestion.requested-by=${INGEST_REQUESTED_BY:-easyv-dev-property}
      - --dip3.ingestion.page-size=${INGEST_PAGE_SIZE:-2000}
    restart: "no"

volumes:
  cube-store:
  neo4j-data:
  neo4j-logs:
  valkey-data:
